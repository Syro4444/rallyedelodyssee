[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/nyx-status"
  to = "/.netlify/functions/nyx-status"
  status = 200

[[redirects]]
  from = "/api/nyx-claim"
  to = "/.netlify/functions/nyx-claim"
  status = 200

[[redirects]]
  from = "/api/time-check"
  to = "/.netlify/functions/time-check"
  status = 200

[[redirects]]
  from = "/api/runtime"
  to = "/.netlify/functions/runtime"
  status = 200
